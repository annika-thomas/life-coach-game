<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Island Mentor</title>
  <meta name="theme-color" content="#a8e3f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Island">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="world"></canvas>

  <!-- HUD -->
  <div class="hud-top">
    <div class="clock" id="clock">
      <span id="clock-icon" class="clock-icon">☀️</span>
      <div><div id="clock-time" class="clock-time">--:--</div><div id="clock-day" class="clock-day">—</div></div>
    </div>
    <div class="hud-right">
      <button class="energy" id="energy" aria-label="Energy">
        <span class="energy-label">⚡ <span id="energy-num">0</span></span>
        <span class="pips" id="energy-pips"></span>
      </button>
      <button class="round-btn" id="btn-journal" aria-label="Journal">📔</button>
    </div>
  </div>

  <div class="title-sign" id="title-sign">
    <div class="plank"><span>Island Mentor</span></div>
    <div class="posts"><i></i><i></i></div>
  </div>

  <div class="bubble" id="bubble"></div>
  <div class="toast" id="toast"></div>

  <nav class="actions">
    <button id="btn-learn" class="action learn"><span>📖</span>Learn</button>
    <button id="btn-moved" class="action moved"><span>👟</span>I moved</button>
    <button id="btn-build" class="action build"><span>🔨</span>Build</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog">
    <header class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="round-btn small" aria-label="Close">✕</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
