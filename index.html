<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Island Mentor</title>
  <meta name="theme-color" content="#a8e3f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Island">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="world"></canvas>

  <!-- HUD -->
  <div class="hud-top">
    <div class="clock" id="clock">
      <span id="clock-icon" class="clock-icon"></span>
      <div><div id="clock-time" class="clock-time">--:--</div><div id="clock-day" class="clock-day"></div></div>
    </div>
    <div class="hud-right">
      <button class="energy" id="energy" aria-label="Energy">
        <span class="energy-label"><span id="energy-ico"></span><span id="energy-num">0</span></span>
        <span class="pips" id="energy-pips"></span>
      </button>
      <button class="round-btn" id="btn-journal" aria-label="Journal"></button>
    </div>
  </div>

  <div class="title-sign" id="title-sign">
    <div class="plank"><span>Island Mentor</span></div>
    <div class="posts"><i></i><i></i></div>
  </div>

  <!-- dialogue: tap anywhere to advance -->
  <div class="dlg-catch" id="dlg-catch"></div>
  <div class="choices" id="choices"></div>
  <div class="dialog" id="dialog">
    <div class="dlg-name" id="dlg-name"></div>
    <p class="dlg-text" id="dlg-text"></p>
    <i class="dlg-next"></i>
  </div>
  <div class="toast" id="toast"></div>

  <!-- name tags that fade in when Pip is next to a place -->
  <div id="labels">
    <button class="place" data-place="library">Library</button>
    <button class="place" data-place="gym">Gym</button>
    <button class="place" data-place="workbench">Workbench</button>
    <button class="place" data-place="dock">Dock</button>
    <button class="place" data-place="pond">Pond</button>
    <button class="place" data-place="home">Home</button>
    <button class="place" data-place="square">Town square</button>
    <button class="place" data-place="market">Market</button>
    <button class="place" data-place="observatory">Observatory</button>
  </div>
  <div class="bench-alert" id="bench-alert"><b>!</b></div>

  <!-- fishing: full-screen touch layer, hint text and the reel meter -->
  <div class="fish-ui" id="fish">
    <p class="fish-hint" id="fish-hint"></p>
    <div class="reel" id="reel">
      <div class="track"><div class="zone" id="zone"></div><div class="fishy" id="fishy"></div></div>
      <div class="meter"><b id="meter"></b></div>
    </div>
  </div>

  <!-- focus time: a plant grows while you're away from the screen -->
  <div class="focus" id="focus">
    <div class="focus-ring" id="focus-ring"><div class="focus-plant" id="focus-plant"><i class="stem"></i><i class="leaf l"></i><i class="leaf r"></i><i class="bloom"></i></div></div>
    <p class="focus-time" id="focus-time">25:00</p>
    <p class="focus-what" id="focus-what">Growing a tree</p>
    <p class="focus-tip">Put the phone down. Pip will look after it.</p>
    <button class="btn ghost" id="focus-stop">Stop early</button>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" aria-modal="true" role="dialog">
    <header class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button id="sheet-close" class="round-btn small" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#4a3b33" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
